services:
  - type: web
    name: excurs-o-ms
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=shared && npm run build --workspace=server
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DEFAULT_LANGUAGE
        value: br
      - key: TZ
        value: America/Campo_Grande
      - key: APP_URL
        value: https://excurs-o-ms.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

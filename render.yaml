services:
  - type: web
    name: excurs-o-ms
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DEFAULT_LANGUAGE
        value: br
      - key: TZ
        value: America/Sao_Paulo
      - key: APP_URL
        value: https://excurs-o-ms.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
